name: 'Release / CD Notify Teams'
description: 'Send Teams notifications for release pipeline success or failure'

inputs:
    status:
        description: 'success or failure'
        required: true
    pipeline_name:
        description: 'Short name shown in failure titles and some success lines'
        required: false
        default: 'Release pipeline'
    step_name:
        description: 'Failed stage name, or success label (e.g. Deployment)'
        required: true
    environment:
        description: 'Environment or stage context'
        required: true
    version:
        description: 'Version for deployment-style success messages'
        required: false
        default: ''
    tag_name:
        description: 'Git tag for deployment-style success messages'
        required: false
        default: ''
    is_uat:
        description: "When 'true', UAT emoji and wording for deployment success"
        required: false
        default: 'false'
    notification_text:
        description: 'Full Teams message body for success (from create-gh-release, etc.)'
        required: false
        default: ''
    is_blocking:
        description: 'Whether this failure blocks further release steps'
        required: false
        default: 'false'

runs:
    using: 'composite'
    steps:
        - name: Notify Teams
          shell: bash
          env:
              NOTIFICATION_TEXT: ${{ inputs.notification_text }}
          run: |
              WEBHOOK_URL="${{ env.TEAMS_WEBHOOK_URL }}"

              if [ -z "$WEBHOOK_URL" ]; then
                echo "Teams webhook URL not available - skipping notification"
                exit 0
              fi

              STATUS="${{ inputs.status }}"
              STEP="${{ inputs.step_name }}"
              ENVIRONMENT="${{ inputs.environment }}"
              PIPELINE="${{ inputs.pipeline_name }}"
              VERSION="${{ inputs.version }}"
              TAG="${{ inputs.tag_name }}"
              IS_UAT="${{ inputs.is_uat }}"
              RUN_URL="${{ env.RUN_URL }}"
              REPOSITORY="${{ env.REPOSITORY }}"
              COMMIT_SHA="${{ env.COMMIT_SHA }}"

              # Blank lines (\n\n) between blocks: Teams often collapses a single \n to a space.
              # Bold only via **Label:** fact lines. jq encodes the text field safely.
              if [ "$STATUS" = "failure" ]; then
                TEXT=$(printf '%s\n\n%s\n\n%s\n\n%s' \
                  "❌ ${PIPELINE} failed - ${STEP}" \
                  "**Context:** ${ENVIRONMENT}" \
                  "**Repository:** ${REPOSITORY}" \
                  "**Commit:** ${COMMIT_SHA}")
                if [ "${{ inputs.is_blocking }}" = "true" ]; then
                  TEXT=$(printf '%s\n\n%s' "$TEXT" "Pipeline stopped - further release steps may be blocked")
                fi
                if [ -n "$RUN_URL" ]; then
                  TEXT=$(printf '%s\n\n%s' "$TEXT" "[View Run](${RUN_URL})")
                fi
              elif [ "$STATUS" = "success" ]; then
                if [ -n "$NOTIFICATION_TEXT" ]; then
                  TEXT="$NOTIFICATION_TEXT"
                else
                  if [ -z "$VERSION" ]; then
                    echo "No notification_text or version for success notify - skipping"
                    exit 0
                  fi
                  if [ "$IS_UAT" = "true" ]; then
                    EMOJI="🧪"
                    RELEASE_TYPE="UAT"
                  else
                    EMOJI="🎉"
                    RELEASE_TYPE="Production"
                  fi
                  TEXT=$(printf '%s\n\n%s' \
                    "${EMOJI} ${RELEASE_TYPE} Deployment Completed" \
                    "**Version:** ${VERSION}")
                  if [ -n "$TAG" ]; then
                    TEXT=$(printf '%s\n\n%s' "$TEXT" "**Tag:** ${TAG}")
                  fi
                  if [ -n "$REPOSITORY" ]; then
                    TEXT=$(printf '%s\n\n%s' "$TEXT" "**Repository:** ${REPOSITORY}")
                  fi
                  TEXT=$(printf '%s\n\n%s' "$TEXT" "Deployment to ${RELEASE_TYPE} environment completed successfully.")
                  if [ -n "$RUN_URL" ]; then
                    TEXT=$(printf '%s\n\n%s' "$TEXT" "[View Run](${RUN_URL})")
                  fi
                fi
              else
                echo "Unknown status: $STATUS"
                exit 1
              fi

              payload=$(jq -nc --arg text "$TEXT" '{text: $text}')

              curl --request POST \
                --silent --show-error \
                --fail \
                --max-time 30 \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "$WEBHOOK_URL"
