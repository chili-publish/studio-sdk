name: PR Build
on: [pull_request]
env:
  NODE_VERSION: 24.x
  # REQUIRED AT WORKFLOW SCOPE — do not move this to the install step only.
  # actions/setup-node with `registry-url` writes an .npmrc containing
  # `${NODE_AUTH_TOKEN}`. Yarn Classic expands that placeholder on EVERY
  # yarn/npm command (test, build, lint, …), not only on `yarn install`.
  # Scoping the token to install alone fails later steps with:
  # Failed to replace env in config: ${NODE_AUTH_TOKEN}.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: build (18)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check cache
        id: cache
        uses: actions/cache@v6
        with:
          path: packages/sdk/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}-0
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@chili-publish"
      - name: install dependencies
        run: yarn install
      - name: run license check
        run: yarn validate-licenses
      - name: run linting
        run: yarn ci-lint
      - name: run tests
        run: yarn cover
      - name: Publish Unit Test Results
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@4e7013f9576bd22ffdae979dc6e68cb9ec2aeece # v2.7.0
        if: always()
        with:
          files: packages/sdk/coverage/**/*.xml
      - name: SonarQube analysis
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: build code
        run: yarn build
      - name: validate sdk examples
        run: cd examples/sdk/basic-typescript-example && npm install && npm run build
      - name: ensure packages/sdk/upload exists
        run: node cicd.js sdk mkdir -p upload/dev-packages/${{ github.event.pull_request.number }}
      - name: pack sdk build
        run: node cicd.js sdk yarn pack -f upload/dev-packages/${{ github.event.pull_request.number }}/studio-sdk.tgz
      - name: prepare for connectors upload
        run: node cicd.js connectors yarn prepare-upload
      - name: copy bundles
        run: |
          cp -R packages/sdk/_bundles packages/sdk/upload/dev-packages/${{ github.event.pull_request.number }}
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: >-
            {
              "clientId": "${{ vars.AZ_AD_CLIENT_ID_CP_RJS_INT_CICD_SP }}",
              "clientSecret": "${{ secrets.AZ_AD_CLIENT_SECRET_CP_RJS_INT_CICD_SP }}",
              "tenantId": "${{ vars.AZ_TENANT_ID }}",
              "subscriptionId": "${{ vars.AZ_SUBSCRIPTION_ID_SAAS_DEV }}"
            }
      - name: Copy to Azure Blob Storage
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.STORAGE_ACCOUNT_NAME_DEV }}" \
              --destination sdk \
              --source packages/sdk/upload/ \
              --overwrite true \
              --auth-mode login
      - name: Copy to Azure Blob Storage (Connectors)
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.STORAGE_ACCOUNT_NAME_DEV }}" \
              --destination sdk \
              --source packages/connectors/upload/ \
              --overwrite true \
              --auth-mode login
      - name: prepare for actions upload
        run: |
          node cicd.js actions node scripts/prepare-release.mjs
      - name: Copy to Azure Blob Storage (Actions)
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.STORAGE_ACCOUNT_NAME_DEV }}" \
              --destination sdk \
              --source packages/actions/cdn/ \
              --overwrite true \
              --auth-mode login
